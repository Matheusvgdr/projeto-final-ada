<div
  class="xl:flex xl:items-center xl:justify-center lg:flex lg:items-center lg:justify-center md:flex md:items-center md:justify-center xl:pt-10"
>
  <section
    class="px-[32px] flex flex-col gap-7 xl:w-[70%] lg:w-[70%] md:w-[85%]"
  >
    <div class="flex flex-col gap-7 xl:gap-[60px] xl:flex-row">
      <div
        class="w-full h-[320px] xl:h-[600px] lg:h-[620px] md:h-[520px] xl:w-[550px] flex items-center justify-center rounded-xl bg-cover bg-center bg-no-repeat"
        [style.backgroundImage]="'url(' + produto()?.imagem + ')'"
      ></div>
      <div class="flex flex-col gap-[12px] xl:gap-[40px] xl:w-[35%]">
        <div class="flex flex-col gap-[12px]">
          <div class="flex items-center gap-1">
            @for (item of arrayEstrelas(); track $index) {
            <i-lucide [img]="estrela" class="w-3 h-3"></i-lucide>
            }
          </div>
          <p class="text-[40px] font-bold">{{ produto()?.titulo }}</p>
          <p>
            {{ produto()?.descricao }}
          </p>
          <p class="text-[28px] font-medium">
            {{ produto()?.valor | currency : "BRL" }}
          </p>
        </div>
        <div class="flex gap-3">
          <button
            (click)="adicionarProdutoCarrinho()"
            class="py-[12px] flex items-center justify-center gap-3 hover:-translate-y-1 duration-500 cursor-pointer w-[90%] bg-indigo-500 border-none rounded-[8px] text-white font-bold text-[14px]"
          >
            Adicionar ao carrinho
            <lucide-angular [img]="adicionar"></lucide-angular>
          </button>
          <button
            (click)="showDialog(produto())"
            class="py-[12px] flex items-center justify-center gap-3 hover:-translate-y-1 duration-500 cursor-pointer w-[10%] bg-rose-500 border-none rounded-[8px] text-white font-bold text-[14px]"
          >
            <lucide-angular [img]="remover"></lucide-angular>
          </button>
        </div>
      </div>
    </div>
    <div class="h-[2px] w-full bg-[#F3F5F7] rounded-full"></div>
    <app-lista-review [produtoId]="produto()?.id"></app-lista-review>
  </section>
</div>

<div class="card flex justify-center">
  <p-dialog
    header="Editar produto"
    [modal]="true"
    [draggable]="false"
    [(visible)]="visible"
    [style]="{ width: '23rem' }"
  >
    <form [formGroup]="formEdicao" class="grid grid-cols-9 gap-6 py-3">
      <p-floatlabel variant="on" class="col-start-1 col-end-10">
        <input
          class="!text-[12px]"
          [fluid]="true"
          pInputText
          formControlName="titulo"
          id="titulo"
          autocomplete="off"
        />
        <label class="!text-[12px]" for="on_label">Título</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="col-start-1 col-end-4">
        <input
          class="!text-[12px]"
          [fluid]="true"
          pInputText
          formControlName="quantidadeEstoque"
          id="quantidadeEstoque"
          autocomplete="off"
        />
        <label class="!text-[12px]" for="on_label">Estoque</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="col-start-4 col-end-7">
        <input
          class="!text-[12px]"
          [fluid]="true"
          pInputText
          formControlName="desconto"
          id="desconto"
          autocomplete="off"
        />
        <label class="!text-[12px]" for="on_label">Desconto</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="col-start-7 col-end-10">
        <input
          class="!text-[12px]"
          [fluid]="true"
          pInputText
          formControlName="valor"
          id="valor"
          autocomplete="off"
        />
        <label class="!text-[12px]" for="on_label">Valor</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="col-start-1 col-end-10">
        <input
          class="!text-[12px]"
          [fluid]="true"
          pInputText
          formControlName="imagem"
          id="imagem"
          autocomplete="off"
        />
        <label class="!text-[12px]" for="on_label">Imagem</label>
      </p-floatlabel>

      <p-floatlabel variant="on" class="col-start-1 col-end-10">
        <textarea
          pTextarea
          id="descricao"
          formControlName="descricao"
          rows="5"
          cols="30"
          style="resize: none"
          class="h-full w-full !text-[12px]"
        ></textarea>
        <label class="!text-[12px]" for="on_label">Descrição</label>
      </p-floatlabel>

      <div class="flex gap-3 col-start-1 col-end-10">
        <button
          (click)="fecharModal()"
          [disabled]="formEdicao.invalid"
          class="py-[12px] bg-zinc-800 flex items-center justify-center gap-3 cursor-pointer hover:-translate-y-1 duration-500 w-full border-none rounded-[8px] text-white font-bold text-[14px] col-start-1 col-end-5"
        >
          Cancelar
        </button>
        <button
          (click)="editarProduto()"
          [disabled]="formEdicao.invalid"
          class="py-[12px] bg-emerald-500 flex items-center justify-center gap-3 cursor-pointer hover:-translate-y-1 duration-500 w-full border-none rounded-[8px] text-white font-bold text-[14px] col-start-1 col-end-5"
        >
          Editar
          <lucide-angular [img]="iconeEditar"></lucide-angular>
        </button>
      </div>
    </form>
  </p-dialog>
</div>
